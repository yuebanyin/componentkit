name: Network image lifecycle validation

on:
  workflow_dispatch:
  push:
    branches:
      - ci/network-image-validation-0fc5eb98

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out validation revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode and report simulator toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_14.3.1.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_14.3.1.app/Contents/Developer
          elif [[ -d /Applications/Xcode_14.3.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_14.3.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build OCMock simulator framework
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Carthage/Build/iOS
          xcodebuild build \
            -project Carthage/Checkouts/ocmock/Source/OCMock.xcodeproj \
            -target 'OCMock iOS' \
            -configuration Release \
            -sdk iphonesimulator \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/Carthage/Build/iOS"
          test -d Carthage/Build/iOS/OCMock.framework
          file Carthage/Build/iOS/OCMock.framework/OCMock

      - name: Prove candidate green and parent lifecycle behavior red
        shell: bash
        run: |
          set -euo pipefail

          candidate=0fc5eb98ab93b5f52afddbec7c1270767555a124
          parent=33819424a7c0cc5595ca448197cb640f39d9a0c5
          test_class=ComponentKitApplicationTests/CKNetworkImageComponentTests
          implementation=ComponentKit/Components/CKNetworkImageComponent.mm
          tests=ComponentKitApplicationTests/CKNetworkImageComponentTests.mm
          git diff --exit-code "$candidate" -- "$implementation" "$tests"
          test "$(git diff --name-only "$parent" "$candidate" | sort | tr '\n' ' ')" = \
            "$(printf '%s\n' "$implementation" "$tests" | sort | tr '\n' ' ')"

          # Modern Clang no longer provides the transitive module visibility
          # expected by this Xcode 11-era umbrella. This runner-only edit is
          # unrelated to the candidate and lets the shared scheme build.
          python3 - <<'PYCOMPAT'
          from pathlib import Path
          path = Path('ComponentKit/ComponentKit.h')
          contents = path.read_text()
          path.write_text(contents.replace(
              '#import <UIKit/UIKit.h>',
              '#import <UIKit/UIKit.h>\n@import RenderCore;',
          ))
          PYCOMPAT

          device_id="$({ xcrun simctl list devices available --json || true; } | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          ')"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b

          common_args=(
            test
            -project ComponentKit.xcodeproj
            -scheme ComponentKit
            -sdk iphonesimulator
            -destination "platform=iOS Simulator,id=$device_id"
            -configuration Debug
            CODE_SIGNING_ALLOWED=NO
            COMPILER_INDEX_STORE_ENABLE=NO
            GCC_TREAT_WARNINGS_AS_ERRORS=NO
            IPHONEOS_DEPLOYMENT_TARGET=12.0
            'OTHER_CPLUSPLUSFLAGS=$(inherited) -include utility'
          )
          methods=(
            testChangingURLAndDownloaderCancelsExactlyOnceThroughTheOriginatingDownloader
            testReplacingEqualDownloaderInstanceForSameURLRestartsWhilePreservingViewIdentity
            testDownloaderReplacementCanRetainLoadedImageUntilReplacementCompletes
            testOutOfOrderCompletionCannotReplaceNewerImage
            testStaleCompletionCannotPreventNewerRequestCancellation
            testSynchronousCompletionDisplaysImageWithoutLeavingCancelableWork
            testCompletionInvokedDuringCancellationIsIgnored
            testReusePoolEntryCancelsAndInvalidatesAndLeavingStartsOneFreshRequest
            testDefaultAndCropOnlyUpdatesDoNotRestartOrInvalidateRequest
            testInitialReplacementAndReuseRequestsUseMainCallbackQueue
          )

          focused_args=()
          for method in "${methods[@]}"; do
            focused_args+=("-only-testing:${test_class}/${method}")
          done

          echo '=== Candidate: all deterministic CKNetworkImageComponentTests must pass ==='
          xcodebuild "${common_args[@]}" "${focused_args[@]}" \
            -resultBundlePath "$RUNNER_TEMP/candidate.xcresult" \
            | tee "$RUNNER_TEMP/candidate.log"
          for method in "${methods[@]}"; do
            grep -F "$method" "$RUNNER_TEMP/candidate.log" | grep -F 'passed'
          done

          echo '=== Substitute parent implementation while retaining all lifecycle regressions ==='
          git checkout "$parent" -- "$implementation"
          git diff --exit-code "$parent" -- "$implementation"

          set +e
          xcodebuild "${common_args[@]}" "${focused_args[@]}" \
            -resultBundlePath "$RUNNER_TEMP/parent.xcresult" \
            >"$RUNNER_TEMP/parent.log" 2>&1
          parent_status=$?
          set -e
          cat "$RUNNER_TEMP/parent.log"
          if [[ $parent_status -eq 0 ]]; then
            echo 'Parent implementation unexpectedly passed all lifecycle regressions' >&2
            exit 1
          fi
          failing_methods=(
            testChangingURLAndDownloaderCancelsExactlyOnceThroughTheOriginatingDownloader
            testReplacingEqualDownloaderInstanceForSameURLRestartsWhilePreservingViewIdentity
            testDownloaderReplacementCanRetainLoadedImageUntilReplacementCompletes
            testOutOfOrderCompletionCannotReplaceNewerImage
            testStaleCompletionCannotPreventNewerRequestCancellation
            testSynchronousCompletionDisplaysImageWithoutLeavingCancelableWork
            testCompletionInvokedDuringCancellationIsIgnored
            testReusePoolEntryCancelsAndInvalidatesAndLeavingStartsOneFreshRequest
            testDefaultAndCropOnlyUpdatesDoNotRestartOrInvalidateRequest
          )
          for method in "${failing_methods[@]}"; do
            grep -F "$method" "$RUNNER_TEMP/parent.log" | grep -F 'failed'
          done
          grep -F 'testInitialReplacementAndReuseRequestsUseMainCallbackQueue' \
            "$RUNNER_TEMP/parent.log" | grep -F 'passed'
